name: Playwright Tests
on:
  push:
    branches: [ main, master, QA ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Selecciona el ambiente para la ejecución de las pruebas'
        required: true
        default: 'QA'
        type: choice
        options:
          - QA
          - Producción
jobs:
  test:
    runs-on: Windows-latest
    environment: ${{ github.event.inputs.environment || 'QA' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci --no-audit
    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~\AppData\Local\ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install
    - name: Create .env file
      run: 
        echo "BASE_URL=${{ secrets.BASE_URL }}" > .env
        echo "TEST_ENV=${{ github.event.inputs.environment || 'QA' }}" >> .env   
    - name: Run Playwright tests
      run: npx playwright test "storePom.spec.ts" --project=chromium --reporter=html
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
